<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Countdown Timer</h1>
        <p class="subtitle">Time remaining until the target date</p>

        <div class="timer">
            <div class="box">
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div class="box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
